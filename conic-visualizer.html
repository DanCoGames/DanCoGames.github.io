<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Conic Sections Explorer — DanCo Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #0d0d12;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e2e8f0;
            user-select: none;
        }

        /* =========================================================
           HEADER
        ========================================================= */

        #header {
            position: absolute;
            top: 20px;
            left: 25px;
            z-index: 10;

            display: flex;
            align-items: center;
            justify-content: space-between;

            width: calc(100% - 50px);

            pointer-events: none;
        }

        .title-area h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        .title-area p {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #94a3b8;
        }

        /* =========================================================
           GRAPH CONTAINER
        ========================================================= */

        #graph-container {
            position: absolute;

            top: 20px;
            right: 25px;

            background: rgba(18, 18, 26, 0.85);

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

            backdrop-filter: blur(10px);

            padding: 15px;

            text-align: center;

            z-index: 10;
        }

        #graph-title {
            font-size: 12px;
            font-weight: 600;

            color: #94a3b8;

            margin-bottom: 8px;

            letter-spacing: 1px;
        }

        canvas#graph2d {
            background: #0a0a10;

            border-radius: 6px;

            border: 1px solid rgba(255,255,255,0.05);
        }

        /* =========================================================
           INSTRUCTIONS
        ========================================================= */

        #instructions {
            position: absolute;

            top: 20px;
            left: 320px;

            background: rgba(0,0,0,0.5);

            padding: 8px 14px;

            border-radius: 8px;

            color: #94a3b8;

            font-size: 12px;

            pointer-events: none;

            border: 1px solid rgba(255,255,255,0.05);

            z-index: 10;
        }

        /* =========================================================
           BOTTOM CONTROLS
        ========================================================= */

        #controls-panel {
            position: absolute;

            bottom: 25px;
            left: 25px;

            width: calc(100% - 50px);

            max-width: 900px;

            background: rgba(18, 18, 26, 0.9);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 14px;

            padding: 20px 25px;

            backdrop-filter: blur(12px);

            box-shadow: 0 10px 30px rgba(0,0,0,0.6);

            z-index: 10;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            align-items: center;
        }

        .slider-group {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .slider-header {
            display: flex;

            justify-content: space-between;

            font-size: 13px;

            font-weight: 500;

            color: #94a3b8;
        }

        .slider-header span:last-child {
            font-family: monospace;

            color: #f8fafc;

            font-weight: 600;
        }

        input[type=range] {
            width: 100%;

            cursor: pointer;

            accent-color: #38bdf8;

            height: 6px;

            background: #334155;

            border-radius: 3px;
        }

        /* =========================================================
           STAT CARDS
        ========================================================= */

        .cards-row {
            grid-column: span 2;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 15px;

            margin-top: 5px;

            border-top: 1px solid rgba(255,255,255,0.06);

            padding-top: 15px;
        }

        .stat-card {
            background: rgba(255,255,255,0.02);

            border: 1px solid rgba(255,255,255,0.06);

            border-radius: 8px;

            padding: 10px 14px;
        }

        .stat-label {
            font-size: 11px;

            font-weight: 600;

            color: #64748b;

            letter-spacing: 0.5px;

            text-transform: uppercase;
        }

        .stat-value {
            font-size: 15px;

            font-weight: 700;

            color: #f8fafc;

            margin-top: 4px;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {

            #instructions {
                display: none;
            }

            #graph-container {
                transform: scale(0.8);
                transform-origin: top right;
            }

            #controls-panel {
                grid-template-columns: 1fr;
            }

            .cards-row {
                grid-column: span 1;

                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================= -->

    <div id="header">

        <div class="title-area">

            <h1>
                3D Conic Sections Explorer
            </h1>

            <p>
                Slicing a double cone with a cutting plane
            </p>

        </div>

    </div>


    <!-- =========================================================
         INSTRUCTIONS
    ========================================================= -->

    <div id="instructions">

        🖱️ <b>Left Click + Drag</b> to Rotate
        |
        📜 <b>Scroll</b> to Zoom

    </div>


    <!-- =========================================================
         2D GRAPH
    ========================================================= -->

    <div id="graph-container">

        <div id="graph-title">
            2D CARTESIAN GRAPH
        </div>

        <canvas
            id="graph2d"
            width="200"
            height="200">
        </canvas>

    </div>


    <!-- =========================================================
         CONTROLS
    ========================================================= -->

    <div id="controls-panel">

        <!-- ANGLE -->

        <div class="slider-group">

            <div class="slider-header">

                <span>
                    Plane Angle (θ)
                </span>

                <span id="angleVal">
                    0°
                </span>

            </div>

            <input
                type="range"
                id="angleSlider"
                min="0"
                max="85"
                value="0"
                step="0.1">

        </div>


        <!-- OFFSET -->

        <div class="slider-group">

            <div class="slider-header">

                <span>
                    Plane Offset (y₀)
                </span>

                <span id="offsetVal">
                    0.00
                </span>

            </div>

            <input
                type="range"
                id="offsetSlider"
                min="-3"
                max="3"
                value="0"
                step="0.1">

        </div>


        <!-- STAT CARDS -->

        <div class="cards-row">

            <div class="stat-card">

                <div class="stat-label">
                    Section Type
                </div>

                <div
                    id="cardType"
                    class="stat-value"
                    style="color:#38bdf8;">
                    Circle
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Eccentricity
                </div>

                <div
                    id="cardEcc"
                    class="stat-value">
                    e = 0.00
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Condition
                </div>

                <div
                    id="cardCondition"
                    class="stat-value">
                    θ = 0°
                </div>

            </div>

        </div>

    </div>


    <!-- =========================================================
         THREE.JS
    ========================================================= -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>


    <script>

        /* =========================================================
           1. SCENE SETUP
        ========================================================= */

        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x0d0d12);

        scene.fog = new THREE.FogExp2(
            0x0d0d12,
            0.012
        );


        /* =========================================================
           CAMERA
        ========================================================= */

        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        camera.position.set(
            28,
            14,
            32
        );


        /* =========================================================
           RENDERER
        ========================================================= */

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document.body.appendChild(
            renderer.domElement
        );


        /* =========================================================
           ORBIT CONTROLS
        ========================================================= */

        const controls =
            new THREE.OrbitControls(
                camera,
                renderer.domElement
            );

        controls.enableDamping = true;

        controls.dampingFactor = 0.05;

        controls.target.set(
            0,
            0,
            0
        );


        /* =========================================================
           LIGHTING
        ========================================================= */

        scene.add(
            new THREE.AmbientLight(
                0xffffff,
                0.8
            )
        );


        const dirLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.2
            );

        dirLight.position.set(
            20,
            40,
            20
        );

        scene.add(
            dirLight
        );


        /* =========================================================
           FLOOR GRID
        ========================================================= */

        const grid =
            new THREE.GridHelper(
                80,
                40,
                0x1e293b,
                0x0f172a
            );

        grid.position.y = -10;

        scene.add(grid);


        /* =========================================================
           2. DOUBLE CONE
        ========================================================= */

        /*
            Cone dimensions

            Radius = 5
            Half-height = 5
            Total cone height = 10

            Cone half-angle:

            alpha = atan(radius / height)
                  = atan(5 / 10)
                  = 26.565°

            This is the angle of a cone generator
            relative to the cone's vertical axis.
        */

        const coneRadius = 5;

        const coneHeight = 10;

        const coneHalfHeight = coneHeight / 2;


        const alphaRad =
            Math.atan(
                coneRadius / coneHeight
            );

        const alphaDeg =
            alphaRad * 180 / Math.PI;


        /*
            k = radius / height

            Cone equation:

                x² + z² = k² y²
        */

        const k =
            coneRadius / coneHeight;


        /* =========================================================
           CONE GEOMETRY
        ========================================================= */

        const coneGeo =
            new THREE.ConeGeometry(
                coneRadius,
                coneHeight,
                64,
                1,
                true
            );


        const coneMat =
            new THREE.MeshPhysicalMaterial({

                color: 0x38bdf8,

                transparent: true,

                opacity: 0.12,

                side: THREE.DoubleSide,

                roughness: 0.1,

                metalness: 0.2,

                depthWrite: false

            });


        /* =========================================================
           TOP CONE
        ========================================================= */

        const topCone =
            new THREE.Mesh(
                coneGeo,
                coneMat
            );

        topCone.position.y =
            coneHalfHeight;

        topCone.rotation.x =
            Math.PI;


        /* =========================================================
           BOTTOM CONE
        ========================================================= */

        const bottomCone =
            new THREE.Mesh(
                coneGeo,
                coneMat
            );

        bottomCone.position.y =
            -coneHalfHeight;


        /* =========================================================
           CONE GROUP
        ========================================================= */

        const coneGroup =
            new THREE.Group();

        coneGroup.add(
            topCone
        );

        coneGroup.add(
            bottomCone
        );

        scene.add(
            coneGroup
        );


        /* =========================================================
           CONE EDGE LINES
        ========================================================= */

        const edgesGeo =
            new THREE.EdgesGeometry(
                coneGeo,
                15
            );


        const edgesMat =
            new THREE.LineBasicMaterial({

                color: 0x38bdf8,

                transparent: true,

                opacity: 0.25

            });


        topCone.add(
            new THREE.LineSegments(
                edgesGeo,
                edgesMat
            )
        );


        bottomCone.add(
            new THREE.LineSegments(
                edgesGeo,
                edgesMat
            )
        );


        /* =========================================================
           3. CUTTING PLANE
        ========================================================= */

        const planeGroup =
            new THREE.Group();


        /*
            PlaneGeometry lies in the XY plane.

            We rotate it around X.

            theta = 0°
                -> horizontal plane
                -> perpendicular to cone axis
                -> circle

            theta increases
                -> plane tilts toward cone axis
        */

        const planeGeo =
            new THREE.PlaneGeometry(
                24,
                24
            );


        const planeMat =
            new THREE.MeshPhysicalMaterial({

                color: 0x38bdf8,

                transparent: true,

                opacity: 0.3,

                side: THREE.DoubleSide,

                roughness: 0.1,

                metalness: 0.1,

                depthWrite: false

            });


        const planeMesh =
            new THREE.Mesh(
                planeGeo,
                planeMat
            );


        /*
            Initial rotation will be
            assigned in updateSimulation().
        */

        const planeEdges =
            new THREE.EdgesGeometry(
                planeGeo
            );


        const planeEdgesMat =
            new THREE.LineBasicMaterial({

                color: 0x38bdf8,

                transparent: true,

                opacity: 0.5

            });


        planeMesh.add(
            new THREE.LineSegments(
                planeEdges,
                planeEdgesMat
            )
        );


        planeGroup.add(
            planeMesh
        );


        scene.add(
            planeGroup
        );


        /* =========================================================
           4. INTERSECTION CURVE
        ========================================================= */

        const curveGroup =
            new THREE.Group();


        planeGroup.add(
            curveGroup
        );


        /*
            IMPORTANT:

            We calculate the REAL mathematical
            intersection between:

                x² + z² = k² y²

            and the cutting plane.

            Local plane coordinates:

                u = x

                v = local Y coordinate

            The plane is rotated around X.

            For theta:

                world y =
                    y0 + v * sin(theta)

                world z =
                    v * cos(theta)

            Therefore:

                x² + z²
                    =
                k² y²

            becomes:

                x² =
                k²(y0 + v sinθ)²
                -
                v² cos²θ
        */


        function calculateIntersection(
            thetaRad,
            y0
        ) {

            const pointsPositive = [];

            const pointsNegative = [];

            /*
                The cone only exists between:

                    -10 <= y <= 10
            */

            const vMin = -30;

            const vMax = 30;

            const steps = 5000;


            /*
                We need separate line segments
                whenever the mathematical curve
                stops existing.
            */

            const positiveSegments = [];

            const negativeSegments = [];


            let positiveCurrent = [];

            let negativeCurrent = [];


            function finishPositive() {

                if (
                    positiveCurrent.length > 1
                ) {

                    positiveSegments.push(
                        positiveCurrent
                    );

                }

                positiveCurrent = [];

            }


            function finishNegative() {

                if (
                    negativeCurrent.length > 1
                ) {

                    negativeSegments.push(
                        negativeCurrent
                    );

                }

                negativeCurrent = [];

            }


            for (
                let i = 0;
                i <= steps;
                i++
            ) {

                const v =
                    vMin +
                    (
                        i / steps
                    ) *
                    (
                        vMax - vMin
                    );


                /*
                    Convert plane-local
                    coordinates into world
                    coordinates.

                    Plane rotation:

                        phi = 90° - theta

                    Therefore:

                        y = y0 + v*sin(theta)

                        z = v*cos(theta)
                */

                const worldY =
                    y0 +
                    v *
                    Math.sin(thetaRad);


                const worldZ =
                    v *
                    Math.cos(thetaRad);


                /*
                    The finite cone is:

                        -10 <= y <= 10
                */

                if (
                    worldY < -coneHeight ||
                    worldY > coneHeight
                ) {

                    finishPositive();
                    finishNegative();

                    continue;
                }


                /*
                    Solve:

                        x² + z² = k²y²

                    for x².
                */

                let xSquared =
                    (
                        k * k *
                        worldY *
                        worldY
                    ) -
                    (
                        worldZ *
                        worldZ
                    );


                /*
                    Floating point tolerance.
                */

                if (
                    xSquared < 0 &&
                    xSquared > -0.0001
                ) {

                    xSquared = 0;

                }


                /*
                    No real intersection
                    at this value of v.
                */

                if (
                    xSquared < 0
                ) {

                    finishPositive();
                    finishNegative();

                    continue;
                }


                const x =
                    Math.sqrt(
                        xSquared
                    );


                /*
                    Positive X branch
                */

                positiveCurrent.push(

                    new THREE.Vector3(
                        x,
                        v,
                        0.025
                    )

                );


                /*
                    Negative X branch
                */

                negativeCurrent.push(

                    new THREE.Vector3(
                        -x,
                        v,
                        0.025
                    )

                );

            }


            finishPositive();

            finishNegative();


            return {
                positive: positiveSegments,
                negative: negativeSegments
            };
        }


        /* =========================================================
           UPDATE INTERSECTION CURVE
        ========================================================= */

        function updateCurve(
            thetaRad,
            y0,
            colorHex
        ) {

            /*
                Remove previous curves.
            */

            while (
                curveGroup.children.length > 0
            ) {

                const child =
                    curveGroup.children[0];


                if (child.geometry) {
                    child.geometry.dispose();
                }


                if (child.material) {

                    if (
                        Array.isArray(
                            child.material
                        )
                    ) {

                        child.material.forEach(
                            m => m.dispose()
                        );

                    } else {

                        child.material.dispose();

                    }

                }


                curveGroup.remove(
                    child
                );
            }


            const intersection =
                calculateIntersection(
                    thetaRad,
                    y0
                );


            /*
                Main curve material
            */

            const lineMat =
                new THREE.LineBasicMaterial({

                    color: colorHex,

                    linewidth: 3,

                    transparent: true,

                    opacity: 1

                });


            /*
                Draw positive branches.
            */

            intersection.positive.forEach(
                segment => {

                    const geometry =
                        new THREE.BufferGeometry()
                            .setFromPoints(
                                segment
                            );


                    const line =
                        new THREE.Line(
                            geometry,
                            lineMat.clone()
                        );


                    curveGroup.add(
                        line
                    );

                }
            );


            /*
                Draw negative branches.
            */

            intersection.negative.forEach(
                segment => {

                    const geometry =
                        new THREE.BufferGeometry()
                            .setFromPoints(
                                segment
                            );


                    const line =
                        new THREE.Line(
                            geometry,
                            lineMat.clone()
                        );


                    curveGroup.add(
                        line
                    );

                }
            );
        }


        /* =========================================================
           5. 2D GRAPH
        ========================================================= */

        const canvas2d =
            document.getElementById(
                "graph2d"
            );


        const ctx =
            canvas2d.getContext(
                "2d"
            );


        /*
            Draw the SAME mathematical
            intersection used by the 3D scene.

            This means the 2D graph is no
            longer an approximate shape.
        */

        function draw2DGraph(
            thetaRad,
            y0,
            type,
            color
        ) {

            ctx.clearRect(
                0,
                0,
                200,
                200
            );


            const width = 200;

            const height = 200;


            const cx = 100;

            const cy = 100;


            /* =====================================================
               GRID
            ===================================================== */

            ctx.strokeStyle =
                "rgba(255,255,255,0.04)";

            ctx.lineWidth = 1;


            for (
                let i = 0;
                i <= 200;
                i += 20
            ) {

                ctx.beginPath();

                ctx.moveTo(
                    i,
                    0
                );

                ctx.lineTo(
                    i,
                    200
                );

                ctx.stroke();


                ctx.beginPath();

                ctx.moveTo(
                    0,
                    i
                );

                ctx.lineTo(
                    200,
                    i
                );

                ctx.stroke();

            }


            /* =====================================================
               AXES
            ===================================================== */

            ctx.strokeStyle =
                "rgba(255,255,255,0.2)";

            ctx.lineWidth = 1;


            ctx.beginPath();

            ctx.moveTo(
                cx,
                0
            );

            ctx.lineTo(
                cx,
                200
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                0,
                cy
            );

            ctx.lineTo(
                200,
                cy
            );

            ctx.stroke();


            /* =====================================================
               GET CURVE DATA
            ===================================================== */

            const intersection =
                calculateIntersection(
                    thetaRad,
                    y0
                );


            const allPoints = [];


            intersection.positive.forEach(
                segment => {

                    segment.forEach(
                        p => allPoints.push(p)
                    );

                }
            );


            intersection.negative.forEach(
                segment => {

                    segment.forEach(
                        p => allPoints.push(p)
                    );

                }
            );


            /*
                Nothing to draw.
            */

            if (
                allPoints.length === 0
            ) {

                ctx.fillStyle =
                    "#94a3b8";

                ctx.font =
                    '12px "Segoe UI"';

                ctx.textAlign =
                    "center";

                ctx.fillText(
                    "No intersection",
                    cx,
                    cy
                );

                return;
            }


            /* =====================================================
               FIND GRAPH BOUNDS
            ===================================================== */

            let minX = Infinity;
            let maxX = -Infinity;

            let minY = Infinity;
            let maxY = -Infinity;


            allPoints.forEach(
                p => {

                    minX =
                        Math.min(
                            minX,
                            p.x
                        );

                    maxX =
                        Math.max(
                            maxX,
                            p.x
                        );

                    minY =
                        Math.min(
                            minY,
                            p.y
                        );

                    maxY =
                        Math.max(
                            maxY,
                            p.y
                        );

                }
            );


            /*
                Give the graph some padding.
            */

            const rangeX =
                Math.max(
                    maxX - minX,
                    0.5
                );


            const rangeY =
                Math.max(
                    maxY - minY,
                    0.5
                );


            const range =
                Math.max(
                    rangeX,
                    rangeY
                );


            /*
                Keep the shape centered.
            */

            const centerX =
                (minX + maxX) / 2;


            const centerY =
                (minY + maxY) / 2;


            const scale =
                150 / range;


            /* =====================================================
               DRAW CURVE
            ===================================================== */

            ctx.strokeStyle =
                color;

            ctx.lineWidth = 2.5;

            ctx.lineCap = "round";

            ctx.lineJoin = "round";


            function drawSegment(
                segment
            ) {

                if (
                    segment.length < 2
                ) {

                    return;

                }


                ctx.beginPath();


                segment.forEach(
                    (p, index) => {

                        const px =
                            cx +
                            (
                                p.x -
                                centerX
                            ) *
                            scale;


                        const py =
                            cy -
                            (
                                p.y -
                                centerY
                            ) *
                            scale;


                        /*
                            Keep graph
                            inside canvas.
                        */

                        if (
                            index === 0
                        ) {

                            ctx.moveTo(
                                px,
                                py
                            );

                        } else {

                            ctx.lineTo(
                                px,
                                py
                            );

                        }

                    }
                );


                ctx.stroke();

            }


            intersection.positive.forEach(
                drawSegment
            );


            intersection.negative.forEach(
                drawSegment
            );


            /* =====================================================
               FORMULA
            ===================================================== */

            let formula = "";


            if (
                type === "Circle"
            ) {

                formula =
                    "Circle";

            }
            else if (
                type === "Ellipse"
            ) {

                formula =
                    "Ellipse";

            }
            else if (
                type === "Parabola"
            ) {

                formula =
                    "Parabola";

            }
            else {

                formula =
                    "Hyperbola";

            }


            ctx.fillStyle =
                "#f8fafc";

            ctx.font =
                'bold 12px "Segoe UI"';

            ctx.textAlign =
                "center";


            ctx.fillText(
                formula,
                cx,
                188
            );

        }


        /* =========================================================
           6. UI ELEMENTS
        ========================================================= */

        const angleSlider =
            document.getElementById(
                "angleSlider"
            );


        const offsetSlider =
            document.getElementById(
                "offsetSlider"
            );


        const angleVal =
            document.getElementById(
                "angleVal"
            );


        const offsetVal =
            document.getElementById(
                "offsetVal"
            );


        const cardType =
            document.getElementById(
                "cardType"
            );


        const cardEcc =
            document.getElementById(
                "cardEcc"
            );


        const cardCondition =
            document.getElementById(
                "cardCondition"
            );


        /* =========================================================
           CORRECT PARABOLA ANGLE
        ========================================================= */

        /*
            Cone generator angle:

                alpha = atan(r/h)

            = 26.565°

            But our slider measures the
            TILT of the plane away from
            the horizontal circular plane.

            Therefore the parabola occurs at:

                thetaCritical
                    =
                90° - alpha

                    =
                63.435°
        */

        const criticalAngleDeg =
            90 - alphaDeg;


        const criticalAngleRad =
            criticalAngleDeg *
            Math.PI /
            180;


        /* =========================================================
           UPDATE SIMULATION
        ========================================================= */

        function updateSimulation() {

            const thetaDeg =
                parseFloat(
                    angleSlider.value
                );


            const y0 =
                parseFloat(
                    offsetSlider.value
                );


            const thetaRad =
                thetaDeg *
                Math.PI /
                180;


            /* =====================================================
               UPDATE UI
            ===================================================== */

            angleVal.innerText =
                thetaDeg.toFixed(1) +
                "°";


            offsetVal.innerText =
                y0.toFixed(2);


            /* =====================================================
               ROTATE CUTTING PLANE
            ===================================================== */

            /*
                PlaneGeometry starts
                in the XY plane.

                To make it horizontal
                at theta = 0:

                    rotation = 90°

                Then tilt it toward
                the cone axis by theta.

                    rotation =
                    90° - theta
            */

            planeGroup.rotation.x =
                Math.PI / 2 -
                thetaRad;


            /*
                Move plane along
                cone axis.
            */

            planeGroup.position.y =
                y0;


            /* =====================================================
               CLASSIFY SECTION
            ===================================================== */

            let type;

            let color;

            let conditionText;


            /*
                EXACT CIRCLE
            */

            if (
                Math.abs(thetaDeg) <
                0.05
            ) {

                type =
                    "Circle";

                color =
                    "#38bdf8";

                conditionText =
                    "θ = 0°";

            }


            /*
                ELLIPSE
            */

            else if (
                thetaDeg <
                criticalAngleDeg - 0.5
            ) {

                type =
                    "Ellipse";

                color =
                    "#a855f7";

                conditionText =
                    `θ < ${criticalAngleDeg.toFixed(2)}°`;

            }


            /*
                PARABOLA
            */

            else if (
                Math.abs(
                    thetaDeg -
                    criticalAngleDeg
                ) <= 0.5
            ) {

                type =
                    "Parabola";

                color =
                    "#f59e0b";

                conditionText =
                    `θ ≈ ${criticalAngleDeg.toFixed(2)}°`;

            }


            /*
                HYPERBOLA
            */

            else {

                type =
                    "Hyperbola";

                color =
                    "#10b981";

                conditionText =
                    `θ > ${criticalAngleDeg.toFixed(2)}°`;

            }


            /* =====================================================
               ECCENTRICITY
            ===================================================== */

            /*
                For this cone:

                    e =
                    sin(theta) /
                    cos(alpha)

                At the critical angle:

                    e = 1

                Therefore:

                    e < 1 -> ellipse

                    e = 1 -> parabola

                    e > 1 -> hyperbola
            */

            let eccentricity =
                Math.sin(thetaRad) /
                Math.cos(alphaRad);


            /*
                Avoid displaying
                tiny floating errors.
            */

            if (
                Math.abs(
                    eccentricity
                ) < 0.0001
            ) {

                eccentricity = 0;

            }


            /* =====================================================
               UPDATE STAT CARDS
            ===================================================== */

            cardType.innerText =
                type;


            cardType.style.color =
                color;


            cardEcc.innerText =
                `e = ${eccentricity.toFixed(2)}`;


            cardCondition.innerText =
                conditionText;


            /* =====================================================
               UPDATE PLANE COLOR
            ===================================================== */

            planeMat.color.set(
                color
            );


            planeEdgesMat.color.set(
                color
            );


            /* =====================================================
               UPDATE REAL 3D CURVE
            ===================================================== */

            updateCurve(
                thetaRad,
                y0,
                color
            );


            /* =====================================================
               UPDATE REAL 2D GRAPH
            ===================================================== */

            draw2DGraph(
                thetaRad,
                y0,
                type,
                color
            );

        }


        /* =========================================================
           SLIDER EVENTS
        ========================================================= */

        angleSlider.addEventListener(
            "input",
            updateSimulation
        );


        offsetSlider.addEventListener(
            "input",
            updateSimulation
        );


        /* =========================================================
           INITIAL UPDATE
        ========================================================= */

        updateSimulation();


        /* =========================================================
           7. ANIMATION LOOP
        ========================================================= */

        function animate() {

            requestAnimationFrame(
                animate
            );


            controls.update();


            renderer.render(
                scene,
                camera
            );

        }


        animate();


        /* =========================================================
           8. WINDOW RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

            }
        );

    </script>

</body>
</html>
